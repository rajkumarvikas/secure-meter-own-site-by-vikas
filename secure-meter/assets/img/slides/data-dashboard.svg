<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A dashboard with charts and numbers">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1c2d"/><stop offset=".55" stop-color="#143c61"/><stop offset="1" stop-color="#1c6a8c"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#e0902f" stop-opacity=".55"/><stop offset="1" stop-color="#e0902f" stop-opacity="0"/></radialGradient>
<linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6b659"/><stop offset="1" stop-color="#d9791b"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".05"/></pattern>
</defs>
<style>
.pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.float{animation:float 5s ease-in-out infinite}
.dash{stroke-dasharray:8 10;animation:dash 2.2s linear infinite}
.spin{animation:spin 14s linear infinite}
.blink{animation:blink 1.6s steps(2,end) infinite}
.draw{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 3.5s ease forwards}
.rise{transform-box:fill-box;transform-origin:bottom;animation:rise 1.4s cubic-bezier(.2,.9,.3,1) both}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.92)}50%{opacity:1;transform:scale(1.06)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes dash{to{stroke-dashoffset:-36}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:.15}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.draw{stroke-dashoffset:0}}
</style>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#grid)"/>

<circle cx="880" cy="210" r="240" fill="url(#glow)" class="pulse"/>
<g class="float">
 <rect x="640" y="60" width="500" height="290" rx="22" fill="#eef3f8"/>
 <rect x="640" y="60" width="500" height="44" rx="22" fill="#d3dde7"/><rect x="640" y="82" width="500" height="22" fill="#d3dde7"/>
 <circle cx="668" cy="82" r="6" fill="#e0902f"/><circle cx="690" cy="82" r="6" fill="#5ff2b0"/><circle cx="712" cy="82" r="6" fill="#7fd1f0"/>
 <rect x="670" y="130" width="160" height="70" rx="12" fill="#143c61"/><text x="690" y="162" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#5ff2b0">98%</text><text x="690" y="184" font-family="Arial,sans-serif" font-size="12" fill="#bcd0e2">Meters reporting</text>
 <rect x="850" y="130" width="130" height="70" rx="12" fill="#143c61"/><text x="870" y="162" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#f6b659">1,284</text><text x="870" y="184" font-family="Arial,sans-serif" font-size="12" fill="#bcd0e2">Files today</text>
 <rect x="1000" y="130" width="110" height="70" rx="12" fill="#143c61"/><text x="1020" y="162" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#7fd1f0">24</text><text x="1020" y="184" font-family="Arial,sans-serif" font-size="12" fill="#bcd0e2">Reports</text>
 <g fill="#17456f">
  <rect class="rise" x="680" y="300" width="26" height="30" rx="4" style="animation-delay:.1s"/><rect class="rise" x="716" y="270" width="26" height="60" rx="4" style="animation-delay:.2s"/>
  <rect class="rise" x="752" y="285" width="26" height="45" rx="4" style="animation-delay:.3s"/><rect class="rise" x="788" y="242" width="26" height="88" rx="4" style="animation-delay:.4s"/>
  <rect class="rise" x="824" y="258" width="26" height="72" rx="4" style="animation-delay:.5s" fill="#e0902f"/>
 </g>
 <path d="M880 310C920 290 940 260 980 270S1050 230 1110 240" fill="none" stroke="#1c8a6a" stroke-width="5" stroke-linecap="round" class="draw"/>
</g>
</svg>
