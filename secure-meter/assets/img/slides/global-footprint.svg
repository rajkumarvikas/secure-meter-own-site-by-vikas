<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A globe with connections from India to other regions">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1c2d"/><stop offset=".55" stop-color="#143c61"/><stop offset="1" stop-color="#1c6a8c"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#e0902f" stop-opacity=".55"/><stop offset="1" stop-color="#e0902f" stop-opacity="0"/></radialGradient>
<linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6b659"/><stop offset="1" stop-color="#d9791b"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".05"/></pattern>
</defs>
<style>
.pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.float{animation:float 5s ease-in-out infinite}
.dash{stroke-dasharray:8 10;animation:dash 2.2s linear infinite}
.spin{animation:spin 14s linear infinite}
.blink{animation:blink 1.6s steps(2,end) infinite}
.draw{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 3.5s ease forwards}
.rise{transform-box:fill-box;transform-origin:bottom;animation:rise 1.4s cubic-bezier(.2,.9,.3,1) both}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.92)}50%{opacity:1;transform:scale(1.06)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes dash{to{stroke-dashoffset:-36}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:.15}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.draw{stroke-dashoffset:0}}
</style>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#grid)"/>

<circle cx="890" cy="200" r="230" fill="url(#glow)" class="pulse"/>
<g class="float">
 <circle cx="890" cy="200" r="150" fill="#0f2f4c" stroke="#7fd1f0" stroke-opacity=".7" stroke-width="3"/>
 <g fill="none" stroke="#7fd1f0" stroke-opacity=".35" stroke-width="1.5">
  <ellipse cx="890" cy="200" rx="150" ry="52"/><ellipse cx="890" cy="200" rx="150" ry="104"/><ellipse cx="890" cy="200" rx="52" ry="150"/><ellipse cx="890" cy="200" rx="104" ry="150"/><path d="M740 200h300M890 50v300"/>
 </g>
 <g fill="#2f6f9a" fill-opacity=".9"><path d="M820 150c20-14 52-10 64 8s-4 36-24 42-46 0-50-24c-2-10 2-18 10-26z"/><path d="M900 230c20-8 44 0 50 18s-8 40-26 42-30-22-28-42c0-8 2-14 4-18z"/><path d="M936 130c16-10 40-6 48 8s-6 30-24 32-30-14-28-28c0-6 2-9 4-12z"/></g>
 <circle cx="930" cy="168" r="9" fill="#e0902f"/><circle cx="930" cy="168" r="20" fill="none" stroke="#e0902f" stroke-width="3" class="pulse"/>
</g>
<g fill="none" stroke="#f6b659" stroke-width="3" stroke-linecap="round">
 <path d="M930 168C1000 70 1090 90 1130 130" class="dash"/>
 <path d="M930 168C1020 200 1090 250 1120 300" class="dash" style="animation-delay:.4s"/>
 <path d="M930 168C860 90 760 90 700 130" class="dash" style="animation-delay:.8s"/>
 <path d="M930 168C840 250 770 290 720 320" class="dash" style="animation-delay:1.2s"/>
</g>
<g fill="#5ff2b0"><circle cx="1130" cy="130" r="8" class="pulse"/><circle cx="1120" cy="300" r="8" class="pulse" style="animation-delay:.4s"/><circle cx="700" cy="130" r="8" class="pulse" style="animation-delay:.8s"/><circle cx="720" cy="320" r="8" class="pulse" style="animation-delay:1.2s"/></g>
</svg>
